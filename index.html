<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Southern Kitchen Fantasy League</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--text:#18181b;--muted:#71717a;--accent:#2563eb;--green:#16a34a;--gold:#d97706;--border:#d4d4d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1000px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;overflow:auto;margin:14px 0}.nav{white-space:nowrap}.nav.active{background:#18181b;color:white}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-height:42px}
input,select,button{font:inherit;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff}button{cursor:pointer;font-weight:650}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bingo{min-height:92px;text-align:left;padding:7px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit;cursor:pointer}.bingo.done{background:#dcfce7;border-color:#86efac}.bingo.free{background:#fef3c7}.bingo .minus{padding:2px 8px;min-height:auto;border-radius:7px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.score{border:1px solid var(--border);border-radius:12px;padding:11px}.score strong{font-size:22px;display:block}.score b{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.player{border:1px solid var(--border);border-radius:14px;padding:12px}.player h3{margin:0 0 4px}.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:12px;margin:2px}
.stat{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}.stars{letter-spacing:1px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:13px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#18181b;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:10000}
.bingo:active{transform:scale(.94)}
.mascot{position:fixed;right:14px;bottom:72px;z-index:9998;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.mascot .face{font-size:42px;display:block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.mascot .face.excited{animation:shake .4s ease-in-out 2}
.bubble{background:#18181b;color:#fff;padding:7px 11px;border-radius:12px;font-size:12px;max-width:170px;text-align:center;margin-bottom:6px;opacity:0;transform:translateY(6px) scale(.9);transition:opacity .22s,transform .22s;pointer-events:none}
.bubble.show{opacity:1;transform:translateY(0) scale(1)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-8deg)}75%{transform:translateX(5px) rotate(8deg)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.scorepop{animation:pop .45s ease;display:inline-block}
.barwrap{background:#e4e4e7;border-radius:999px;height:8px;overflow:hidden;margin:8px 0}
.barfill{background:var(--accent);height:100%;transition:width .35s ease}
@media(max-width:560px){main{padding:9px}.top h1{font-size:20px}.grid{gap:3px}.bingo{min-height:82px;padding:5px;font-size:11px}.bingo .pts{font-weight:800}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>🏆 Southern Kitchen Fantasy League</h1><div class="muted">Draft your team. Score the shift. Crown the MVP.</div></div><button id="reset" class="danger">New Season</button></div>
<nav id="nav"></nav>

<section id="setup" class="view"></section>
<section id="draft" class="view" style="display:none"></section>
<section id="score" class="view" style="display:none"></section>
<section id="league" class="view" style="display:none"></section>
<section id="rules" class="view" style="display:none"></section>
</main>
<div id="toast" class="toast"></div>
<div id="mascot" class="mascot" onclick="mascotPoke()"><div id="mascotBubble" class="bubble"></div><div id="mascotFace" class="face">👨‍🍳</div></div>

<script>
const MENU_VERSION=2;
const DEFAULT_MENU=[
["Turkey Wings",4],["Stuffed Flounder",5],["Short Ribs",5],["Southern Fried Shrimp",3],
["Southern Fried Fish",3],["Crab Cakes",5],["Salmon Cakes",4],["Cakes",2],["Chicken Tenders",2],
["Big Mama White",3],["Big Mama Dark",3],["Salmon",4],["Flatbread Pizza",3],
["Burger",2],["Fried Pork Chops",3],["Country",3],["Fried Chicken",2],
["Grilled Pork Chops Salad",3],["Seafood Platter",5],["Buffalo Shrimp",3],["Mouth of the South",3],
["Fried Okra",2],["Fried Pickles",2],["Catfish Bites",3],["Salmon Bites",4],
["Herb",3],["Roasted Chicken",3]
];
const TICKET_ITEM=["⏱️ Ticket Time Bonus",5];
const BOARD_SIZE=25;
const skills=["Sales","Upselling","Speed","Accuracy","Guest Experience"];
let S=JSON.parse(localStorage.getItem("fantasyServerLeagueV2")||"null")||{
teams:["Team 1","Team 2"],servers:[],week:1,shift:1,history:[],current:null,rush:false,menu:null,menuVersion:0
};
function teamLabel(t){return t?t:"Solo"}
function ticketIdx(){return S.menu.length}
function pool(){return [...S.menu,TICKET_ITEM]}
function taskName(poolIdx){return poolIdx===ticketIdx()?`⏱️ Ticket Time Check (tickets under ${S.rush?30:20} min — tap every ${S.rush?30:20} min to log a check)`:pool()[poolIdx][0]}
function taskPts(poolIdx){return pool()[poolIdx][1]}
function randomBoard(){
 let idxs=S.menu.map((m,i)=>i);
 for(let i=idxs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[idxs[i],idxs[j]]=[idxs[j],idxs[i]]}
 let picked=idxs.slice(0,BOARD_SIZE-1);
 while(picked.length<BOARD_SIZE-1&&idxs.length){picked.push(idxs[Math.floor(Math.random()*idxs.length)])}
 picked.push(ticketIdx());
 for(let i=picked.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]]}
 return picked;
}
function reshuffleAllBoards(){S.servers.forEach(s=>{s.board=randomBoard();s.done=Array(BOARD_SIZE).fill(0);s.bingoLines=0;s.clutch=false;s.full=false;s.bonusPts=0;s.powerupReady=true;s.powerupArmed=false;s.lastTicketCheck=0})}
function createServer(name,team){
 return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,team,board:randomBoard(),done:Array(BOARD_SIZE).fill(0),skill:Object.fromEntries(skills.map(x=>[x,3])),bingoLines:0,clutch:false,full:false,bonusPts:0,powerupReady:true,powerupArmed:false,lastTicketCheck:0};
}
if(!S.menu||S.menuVersion!==MENU_VERSION){S.menu=DEFAULT_MENU.map(x=>[...x]);S.menuVersion=MENU_VERSION;S.servers.forEach(s=>{s.board=null})}
if(S.rush===undefined)S.rush=false;
(function(){let poolSize=S.menu.length+1;(S.servers||[]).forEach(s=>{if(!s.board||s.board.length!==BOARD_SIZE||s.board.some(i=>i>=poolSize)){s.board=randomBoard();s.done=Array(BOARD_SIZE).fill(0);s.bingoLines=0;s.clutch=false;s.full=false}if(s.bonusPts===undefined)s.bonusPts=0;if(s.powerupReady===undefined)s.powerupReady=true;if(s.powerupArmed===undefined)s.powerupArmed=false;if(s.lastTicketCheck===undefined)s.lastTicketCheck=0})})();
let currentView="setup";
function save(){localStorage.setItem("fantasyServerLeagueV2",JSON.stringify(S));render()}
function render(){renderView(currentView)}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1300)}
function stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
let mascotTimer=null;
function mascotSay(text,mood){
 let bubble=document.getElementById("mascotBubble"),face=document.getElementById("mascotFace");
 if(!bubble||!face)return;
 bubble.textContent=text;bubble.classList.add("show");
 face.textContent=mood||"👨‍🍳";face.classList.add("excited");
 clearTimeout(mascotTimer);
 mascotTimer=setTimeout(()=>{bubble.classList.remove("show");face.classList.remove("excited");face.textContent="👨‍🍳"},2400);
}
function mascotPoke(){
 let phrases=["Let's get this shift!","You've got this!","Ring 'em up!","Go get that Bingo!","Chef's watching 👀"];
 mascotSay(phrases[Math.floor(Math.random()*phrases.length)],"👨‍🍳");
}
function celebrate(){
 let colors=['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6'];
 for(let i=0;i<24;i++){
  let p=document.createElement('div');
  p.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:8px;height:8px;background:${colors[i%colors.length]};border-radius:2px;z-index:10001;pointer-events:none;transition:transform 1.1s ease-in,opacity 1.1s ease-in;`;
  document.body.appendChild(p);
  requestAnimationFrame(()=>{p.style.transform=`translateY(${60+Math.random()*30}vh) rotate(${Math.random()*360}deg)`;p.style.opacity='0'});
  setTimeout(()=>p.remove(),1200);
 }
}
function serverScore(s){return s.board.reduce((a,poolIdx,i)=>a+(s.done[i]||0)*taskPts(poolIdx),0)+(s.bonusPts||0)+(s.bingoLines||0)*5+((s.bingoLines||0)>=2?5:0)+(s.clutch?10:0)+(s.full?25:0)}
function lines(s){let d=s.done,a=[];for(let r=0;r<5;r++)a.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)a.push([0,1,2,3,4].map(r=>r*5+c));a.push([0,6,12,18,24],[4,8,12,16,20]);return a.filter(x=>x.every(i=>d[i]));}
function teamScore(team){return S.servers.filter(s=>s.team===team).reduce((a,s)=>a+serverScore(s),0)}
function nav(active){
 document.getElementById("nav").innerHTML=[["setup","⚙️ Setup"],["draft","🎯 Draft"],["score","📝 Scorekeeper"],["league","🏆 League"],["rules","📋 Rules"]].map(x=>`<button class="nav ${active===x[0]?"active":""}" onclick="show('${x[0]}')">${x[1]}</button>`).join("");
}
function show(id){currentView=id;document.querySelectorAll(".view").forEach(x=>x.style.display="none");document.getElementById(id).style.display="block";nav(id);renderView(id)}
function renderView(id){if(id==="setup")renderSetup();if(id==="draft")renderDraft();if(id==="score")renderScore();if(id==="league")renderLeague();if(id==="rules")renderRules()}
function renderSetup(){
 let v=document.getElementById("setup");
 v.innerHTML=`<div class="panel"><h2>⚙️ League Setup</h2><div class="row">
 <input id="tn" placeholder="Team name"><button class="primary" onclick="addTeam()">Add Team</button>
 <input id="sn" placeholder="Server name"><select id="st"><option value="">Solo (no team)</option>${S.teams.map(t=>`<option>${esc(t)}</option>`).join("")}</select><button onclick="addServer()">Add Server</button></div>
 <p class="muted">Create teams first, then add your servers. You can change teams later from the Draft tab.</p></div>
 <div class="panel"><h2>Teams</h2><div class="scores">${S.teams.map(t=>`<div class="score"><b>${esc(t)}</b><strong>${teamScore(t)}</strong><span class="muted">${S.servers.filter(s=>s.team===t).length} servers</span></div>`).join("")}</div></div>
 <div class="panel"><h2>🍽️ Menu Items</h2><p class="muted">Editing the menu redeals everyone's board. The Ticket Time Bonus square is built in and isn't listed here.</p>
 <div class="row"><input id="min" placeholder="Item name"><input id="mip" type="number" min="1" max="9" value="3" style="width:70px"><button class="primary" onclick="addMenuItem()">Add Item</button></div>
 <table><tr><th>Item</th><th>Pts</th><th></th></tr>${S.menu.map((m,i)=>`<tr><td>${esc(m[0])}</td><td>${m[1]}</td><td><button class="danger" style="padding:2px 8px;min-height:auto" onclick="removeMenuItem(${i})">🗑️</button></td></tr>`).join("")}</table></div>`;
}
function addTeam(){let n=document.getElementById("tn").value.trim();if(!n)return;S.teams.push(n);save();toast("Team added")}
function addServer(){let n=document.getElementById("sn").value.trim(),team=document.getElementById("st").value;if(!n)return;S.servers.push(createServer(n,team));save();toast("Server added")}
function addMenuItem(){let n=document.getElementById("min").value.trim(),p=parseInt(document.getElementById("mip").value)||3;if(!n)return;S.menu.push([n,Math.max(1,Math.min(9,p))]);reshuffleAllBoards();save();toast("Menu item added — boards redealt")}
function removeMenuItem(i){if(!confirm("Remove this menu item? Everyone's board will be redealt."))return;S.menu.splice(i,1);reshuffleAllBoards();save();toast("Menu item removed — boards redealt")}
function renderDraft(){
 let v=document.getElementById("draft");
 v.innerHTML=`<div class="panel"><h2>🎯 Draft Room</h2>
 <div class="row"><input id="jn" placeholder="Your name"><select id="jt"><option value="">Solo (no team)</option>${S.teams.map(t=>`<option>${esc(t)}</option>`).join("")}</select><button class="primary" onclick="joinTeam()">Join Team</button></div>
 <p class="muted">Type your name and pick a team to join right here, or use the team selector on an existing player card. Each player gets their own randomized 25-square board. Ratings are 1–5 and are for your league's own game only.</p></div><div class="cards">${S.servers.map(s=>`<div class="player"><div class="row" style="justify-content:space-between"><h3>${esc(s.name)}</h3><button class="danger" style="padding:3px 9px;min-height:auto" onclick="removeServer('${s.id}')">🗑️ Remove</button></div><span class="badge">${esc(teamLabel(s.team))}</span><select onchange="move('${s.id}',this.value)"><option value="">Solo (no team)</option>${S.teams.map(t=>`<option ${t===s.team?"selected":""}>${esc(t)}</option>`).join("")}</select>${skills.map(k=>`<div class="stat"><span>${k}</span><span class="stars">${stars(s.skill[k])}</span></div>`).join("")}<div class="row" style="margin-top:7px">${skills.map(k=>`<button onclick="skill('${s.id}','${k}',-1)">−</button><button onclick="skill('${s.id}','${k}',1)">+ ${k}</button>`).join("")}</div></div>`).join("")||'<p class="muted">Add servers in Setup or Join Team above.</p>'}</div>`;
}
function joinTeam(){let n=document.getElementById("jn").value.trim(),t=document.getElementById("jt").value;if(!n)return;S.servers.push(createServer(n,t));save();toast(n+" joined "+teamLabel(t))}
function move(id,t){let s=S.servers.find(x=>x.id===id);s.team=t;save()}
function removeServer(id){if(!confirm("Remove this player? This can't be undone."))return;S.servers=S.servers.filter(x=>x.id!==id);if(S.current===id)S.current=null;save();toast("Player removed")}
function skill(id,k,d){let s=S.servers.find(x=>x.id===id);s.skill[k]=Math.max(1,Math.min(5,s.skill[k]+d));save()}
function toggleRush(){S.rush=!S.rush;save()}
function shuffleBoard(){let s=S.servers.find(x=>x.id===S.current);if(!s)return;s.board=randomBoard();s.done=Array(BOARD_SIZE).fill(0);s.bingoLines=0;s.clutch=false;s.full=false;s.bonusPts=0;s.powerupReady=true;s.powerupArmed=false;s.lastTicketCheck=0;save();toast("New board dealt!")}
function usePowerup(){let s=S.servers.find(x=>x.id===S.current);if(!s||!s.powerupReady||s.powerupArmed)return;s.powerupArmed=true;s.powerupReady=false;mascotSay("Double Points armed! ⚡","⚡");save();toast("⚡ Double Points armed — your next ring-up is worth double!")}
function renderScore(){
 let v=document.getElementById("score"),cur=S.current&&S.servers.find(s=>s.id===S.current);if(!cur&&S.servers[0]){S.current=S.servers[0].id;cur=S.servers[0]}
 v.innerHTML=`<div class="panel"><div class="row"><select onchange="S.current=this.value;renderScore()">${S.servers.map(s=>`<option value="${s.id}" ${s.id===S.current?"selected":""}>${esc(s.name)} — ${esc(teamLabel(s.team))}</option>`).join("")}</select><button onclick="toggleRush()">${S.rush?"🔥 Rush Hour (30 min checks)":"🕒 Normal Hours (20 min checks)"}</button><button onclick="shuffleBoard()">🔀 New Board</button><button onclick="completeShift()">🏁 End Shift</button><button onclick="clearCurrent()">Clear Player</button></div></div>`;
 if(!cur){v.innerHTML+=`<div class="panel muted">Add servers first.</div>`;return}
 v.innerHTML+=`<div class="panel"><div class="row"><button class="primary" onclick="usePowerup()" ${cur.powerupArmed||!cur.powerupReady?"disabled":""}>${cur.powerupArmed?"⚡ Armed — tap an item":(cur.powerupReady?"⚡ Use Double Points (1 per shift)":"⚡ Used this shift")}</button><span class="muted">${cur.powerupArmed?"Your next ring-up is worth 2×":"One free double-points wildcard per shift"}</span></div></div>`;
 let ls=lines(cur),score=serverScore(cur),pct=Math.round(cur.done.filter(x=>x>0).length/BOARD_SIZE*100);
 v.innerHTML+=`<div class="panel"><h2>${esc(cur.name)} • <span class="scorepop">${score} pts</span></h2><div class="muted">${esc(teamLabel(cur.team))} • ${ls.length} completed Bingo lines${cur.clutch?" • 🔥 Clutch +10":""}${cur.full?" • 🏆 Full Card +25":""}</div><div class="barwrap"><div class="barfill" style="width:${pct}%"></div></div><div class="muted">${pct}% of board filled</div><div class="grid" style="margin-top:12px">${cur.board.map((poolIdx,i)=>{let n=cur.done[i]||0,name=taskName(poolIdx),pts=taskPts(poolIdx);return `<div class="bingo ${n>0?"done":""}" onclick="mark('${cur.id}',${i},1)"><span class="pts">+${pts} ea</span><span>${esc(name)}</span><span class="muted" style="display:flex;justify-content:space-between;align-items:center;gap:4px">${n>0?`<span>×${n} • ${n*pts} pts</span><button class="minus" onclick="event.stopPropagation();mark('${cur.id}',${i},-1)">−</button>`:"<span>tap to ring up</span>"}</span></div>`}).join("")}</div><button class="bingo free" style="width:100%;margin-top:8px" onclick="bingo('${cur.id}')"><span class="pts">BINGO</span><span>🎰 Complete a line</span><span class="muted">+10 first / lines +5</span></button></div>`;
}
function mark(id,i,delta){let s=S.servers.find(x=>x.id===id);let beforeLines=s.bingoLines||0,wasFull=s.full,msg=delta>0?"Rung up":"Removed one";if(delta>0&&s.board[i]===ticketIdx()){let interval=(S.rush?30:20)*60*1000,now=Date.now();if(s.lastTicketCheck&&now-s.lastTicketCheck<interval){toast(`Next ticket check in ${Math.ceil((interval-(now-s.lastTicketCheck))/60000)} min`);return}s.lastTicketCheck=now}s.done[i]=Math.max(0,(s.done[i]||0)+delta);if(delta>0&&s.powerupArmed){let bonus=taskPts(s.board[i]);s.bonusPts=(s.bonusPts||0)+bonus;s.powerupArmed=false;msg=`⚡ Double Points! +${bonus} bonus`}s.bingoLines=lines(s).length;if(s.bingoLines&&!S.servers.some(x=>x.clutch))s.clutch=true;s.full=s.done.every(Boolean);
 if(s.full&&!wasFull){celebrate();mascotSay("FULL CARD! Legendary shift! 🏆","🏆")}
 else if(s.bingoLines>beforeLines){celebrate();mascotSay(["BINGO! Let's go!","You're on fire! 🔥","Line complete!"][Math.floor(Math.random()*3)],"🎉")}
 else if(delta>0){mascotSay(["Nice sale!","Cha-ching! 💰","Keep it up!","That's the way!"][Math.floor(Math.random()*4)],"😄")}
 save();toast(msg)}
function bingo(id){let s=S.servers.find(x=>x.id===id);let before=s.bingoLines||0;s.bingoLines=lines(s).length;if(!s.bingoLines)return toast("Complete a row, column, or diagonal first.");if(s.bingoLines>before){celebrate();mascotSay("BINGO! Let's go! 🎉","🎉")}if(!S.servers.some(x=>x.clutch))s.clutch=true;save();toast("BINGO!")}
function clearCurrent(){let s=S.servers.find(x=>x.id===S.current);if(!s)return;s.done=Array(BOARD_SIZE).fill(0);s.bingoLines=0;s.clutch=false;s.full=false;save()}
function completeShift(){S.history.push({week:S.week,shift:S.shift,date:new Date().toLocaleDateString(),scores:S.servers.map(s=>({name:s.name,team:s.team,score:serverScore(s),rungUp:s.done.reduce((a,b)=>a+b,0),lines:s.bingoLines||0,unique:s.done.filter(x=>x>0).length,clutch:!!s.clutch,full:!!s.full}))});S.shift++;reshuffleAllBoards();mascotSay("Shift logged! Great work 👋","👋");save();toast("Shift saved! New boards dealt.")}
function computeAwards(){
 if(!S.servers.length)return null;
 let byScore=[...S.servers].sort((a,b)=>serverScore(b)-serverScore(a));
 let closer=[...S.servers].sort((a,b)=>b.done.reduce((x,y)=>x+y,0)-a.done.reduce((x,y)=>x+y,0))[0];
 let lockdown=[...S.servers].sort((a,b)=>(b.bingoLines||0)-(a.bingoLines||0))[0];
 let sixthMan=[...S.servers].sort((a,b)=>b.done.filter(x=>x>0).length-a.done.filter(x=>x>0).length)[0];
 return {mvp:byScore[0],clutchHolder:S.servers.find(s=>s.clutch)||null,closer,lockdown,sixthMan};
}
function lifetimeStats(){
 let stats={};
 function ensure(name){if(!stats[name])stats[name]={score:0,rungUp:0,lines:0,unique:0,clutchCount:0};return stats[name]}
 S.history.forEach(h=>h.scores.forEach(x=>{let r=ensure(x.name);r.score+=x.score||0;r.rungUp+=x.rungUp||0;r.lines+=x.lines||0;r.unique+=x.unique||0;if(x.clutch)r.clutchCount++}));
 S.servers.forEach(s=>{let r=ensure(s.name);r.score+=serverScore(s);r.rungUp+=s.done.reduce((a,b)=>a+b,0);r.lines+=s.bingoLines||0;r.unique+=s.done.filter(x=>x>0).length;if(s.clutch)r.clutchCount++});
 return stats;
}
function tierFor(value,bronze,silver,gold){if(value>=gold)return"🥇 Gold";if(value>=silver)return"🥈 Silver";if(value>=bronze)return"🥉 Bronze";return null}
function renderBadgeCase(){
 let stats=lifetimeStats(),names=Object.keys(stats);
 if(!names.length)return '<p class="muted">Play a few shifts to start earning badges.</p>';
 return `<div class="cards">${names.map(name=>{
  let r=stats[name];
  let badges=[["🏆 MVP",tierFor(r.score,50,150,300)],["🔥 Clutch",tierFor(r.clutchCount,1,5,15)],["💰 Closer",tierFor(r.rungUp,25,75,150)],["🎯 Lockdown",tierFor(r.lines,5,15,30)],["🤝 Sixth Man",tierFor(r.unique,40,100,200)]].filter(b=>b[1]);
  return `<div class="player"><h3>${esc(name)}</h3>${badges.length?badges.map(b=>`<span class="badge">${b[1]} ${b[0]}</span>`).join(""):'<span class="muted">No badges yet</span>'}</div>`;
 }).join("")}</div>`;
}
function recapText(entry){
 let byScore=[...entry.scores].sort((a,b)=>b.score-a.score);
 let closer=[...entry.scores].sort((a,b)=>(b.rungUp||0)-(a.rungUp||0))[0];
 let lockdown=[...entry.scores].sort((a,b)=>(b.lines||0)-(a.lines||0))[0];
 let sixth=[...entry.scores].sort((a,b)=>(b.unique||0)-(a.unique||0))[0];
 let clutch=entry.scores.find(x=>x.clutch);
 let lines=[`🏆 Southern Kitchen Fantasy League — Week ${entry.week}, Shift ${entry.shift} (${entry.date})`,
  `🥇 MVP: ${byScore[0].name} — ${byScore[0].score} pts`,
  clutch?`🔥 Clutch: ${clutch.name}`:null,
  closer?`💰 Closer: ${closer.name} (${closer.rungUp||0} sales)`:null,
  lockdown?`🎯 Lockdown: ${lockdown.name} (${lockdown.lines||0} lines)`:null,
  sixth?`🤝 Sixth Man: ${sixth.name} (${sixth.unique||0} items)`:null,
  "","Scores:",...byScore.map(x=>`${x.name}: ${x.score}`)
 ].filter(Boolean);
 return lines.join("\n");
}
function copyRecap(idx){
 let entry=S.history[idx];if(!entry)return;
 let text=recapText(entry);
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("Recap copied — paste it in your group chat!")).catch(()=>prompt("Copy this recap:",text))}
 else prompt("Copy this recap:",text);
}
function renderTrendChart(){
 if(!S.history.length)return '<p class="muted">Complete a shift to start seeing trends.</p>';
 let names=[...new Set(S.history.flatMap(h=>h.scores.map(x=>x.name)))];
 let W=600,H=160,pad=24;
 let maxScore=Math.max(1,...S.history.flatMap(h=>h.scores.map(x=>x.score)));
 let stepX=S.history.length>1?(W-pad*2)/(S.history.length-1):0;
 let colors=['#2563eb','#16a34a','#d97706','#b91c1c','#7c3aed','#0891b2','#db2777'];
 let paths=names.map((name,ni)=>{
  let pts=S.history.map((entry,hi)=>{let rec=entry.scores.find(x=>x.name===name);let val=rec?rec.score:0;let x=pad+hi*stepX;let y=H-pad-(val/maxScore)*(H-pad*2);return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="${colors[ni%colors.length]}" stroke-width="2"/>`;
 }).join('');
 let legend=names.map((n,i)=>`<span class="badge" style="border-color:${colors[i%colors.length]}">${esc(n)}</span>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:160px;background:#fafafa;border-radius:8px">${paths}</svg><div style="margin-top:6px">${legend}</div>`;
}
function renderLeague(){
 let v=document.getElementById("league"),ts=[...S.teams].sort((a,b)=>teamScore(b)-teamScore(a));
 let ps=[...S.servers].sort((a,b)=>serverScore(b)-serverScore(a));
 let aw=computeAwards();
 v.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">🏆 Current Standings</h2><span class="muted">Week ${S.week} • Shift ${S.shift}</span></div><table><tr><th>#</th><th>Team</th><th>Points</th><th>Servers</th></tr>${ts.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t)}</td><td><b>${teamScore(t)}</b></td><td>${S.servers.filter(s=>s.team===t).length}</td></tr>`).join("")}</table></div>
 ${aw?`<div class="panel"><h2>🏅 Shift Awards</h2><div class="scores">
 <div class="score"><b>🏆 MVP</b><strong style="font-size:16px">${esc(aw.mvp.name)}</strong></div>
 <div class="score"><b>🔥 Clutch</b><strong style="font-size:16px">${aw.clutchHolder?esc(aw.clutchHolder.name):"—"}</strong></div>
 <div class="score"><b>💰 Closer</b><strong style="font-size:16px">${esc(aw.closer.name)}</strong></div>
 <div class="score"><b>🎯 Lockdown</b><strong style="font-size:16px">${esc(aw.lockdown.name)}</strong></div>
 <div class="score"><b>🤝 Sixth Man</b><strong style="font-size:16px">${esc(aw.sixthMan.name)}</strong></div>
 </div></div>`:""}
 <div class="panel"><h2>⭐ MVP Race</h2><table><tr><th>#</th><th>Server</th><th>Team</th><th>Points</th></tr>${ps.map((s,i)=>`<tr><td>${i+1}</td><td>${i===0?"🏆 ":""}${esc(s.name)}</td><td>${esc(teamLabel(s.team))}</td><td><b>${serverScore(s)}</b></td></tr>`).join("")||'<tr><td colspan="4">No servers yet.</td></tr>'}</table></div>
 <div class="panel"><h2>🥉 Badge Case</h2><p class="muted">Lifetime tiers — Bronze → Silver → Gold — built automatically from every shift played.</p>${renderBadgeCase()}</div>
 <div class="panel"><h2>📈 Score Trends</h2>${renderTrendChart()}</div>
 <div class="panel"><h2>📅 Shift History</h2>${S.history.length?`<button class="primary" style="margin-bottom:10px" onclick="copyRecap(${S.history.length-1})">📋 Copy Latest Recap</button>`:""}${S.history.length?S.history.slice().reverse().map((h,ri)=>{let idx=S.history.length-1-ri;return `<div class="score" style="margin-bottom:7px"><div class="row" style="justify-content:space-between"><b>Week ${h.week}, Shift ${h.shift}</b><button style="padding:3px 9px;min-height:auto" onclick="copyRecap(${idx})">📋 Copy</button></div><span class="muted">${h.date}</span><div>${h.scores.map(x=>`${esc(x.name)}: ${x.score}`).join(" • ")}</div></div>`}).join(""):"<span class='muted'>No completed shifts yet.</span>"}</div>`;
}
function renderRules(){
 document.getElementById("rules").innerHTML=`<div class="panel"><h2>📋 League Rules</h2><ul><li>Each time you ring up an item on your board, its printed points are added — selling it again stacks more points.</li><li>Every player gets their own random 25-square (5×5) board drawn from the Menu Items list in Setup — a fresh one is dealt automatically at the start of each shift, or tap 🔀 New Board in Scorekeeper to redeal early. Editing the menu redeals every board too.</li><li>Each completed row, column, or diagonal is worth +5. Completing 2+ lines earns an additional +5 bonus.</li><li>The first server to complete a Bingo line gets 🔥 Clutch +10.</li><li>A full 25-square card earns 🏆 +25.</li><li>Every board includes a ⏱️ Ticket Time Check square — a periodic self-check, not a live stopwatch. Toggle Rush Hour / Normal Hours in Scorekeeper to set how often you check: every 30 minutes during a rush, every 20 minutes during normal times. When you glance at your tickets and they're coming in under that goal, tap the square to log it — it's gated so you can only log one check per interval.</li><li>Use the Scorekeeper tab during the shift; End Shift records results and deals fresh boards for the next shift.</li><li>Shift Awards (League tab) are calculated live: MVP (top score), Clutch (current first-Bingo holder), Closer (most items rung up), Lockdown (most completed lines), and Sixth Man (widest menu coverage).</li><li>⚡ Power-up: once per shift, tap "Use Double Points" in Scorekeeper to arm it — your very next ring-up banks double that item's points. Use it on a big-ticket item for the biggest payoff.</li><li>🥉 Badge Case (League tab): lifetime Bronze/Silver/Gold tiers for each award, built automatically from every shift you've ever played — no extra taps needed.</li><li>📋 Recap: after End Shift, hit "Copy Latest Recap" (or Copy next to any past shift) in League to copy a shareable text summary — paste it straight into your group chat.</li><li>Skill ratings are optional role-play stats and do not change points automatically.</li></ul></div>`;
}
document.getElementById("reset").onclick=()=>{if(confirm("Erase the entire league, teams, players, and history?")){localStorage.removeItem("fantasyServerLeagueV2");location.reload()}};

show("setup");
</script>
